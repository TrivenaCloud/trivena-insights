name: Publish GitHub Package
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/publish-package.yml'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@trivenacloud'
      - name: Publish
        working-directory: packages/trivena-insights
        run: npm publish --access public || npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
